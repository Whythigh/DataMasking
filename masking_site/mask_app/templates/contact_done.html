<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if ok %}Message sent{% else %}Something went wrong{% endif %} · DataRepli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f8fafc; color:#0b1a33; line-height:1.5; }
.container { max-width:1280px; margin:0 auto; padding:0 32px; }
nav { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid rgba(0,0,0,.04); }
.logo { font-size:24px; font-weight:700; letter-spacing:-.5px; color:#0b1a33; text-decoration:none; }
.logo span { color:#2563eb; }
.wrap { max-width:520px; margin:0 auto; padding:80px 0; text-align:center; }
.icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
.icon.ok { background:#dcfce7; } .icon.ok i { color:#059669; font-size:28px; }
.icon.err { background:#fef2f2; } .icon.err i { color:#dc2626; font-size:28px; }
h1 { font-size:30px; font-weight:700; letter-spacing:-.7px; margin-bottom:12px; }
p { font-size:16px; color:#64748b; margin-bottom:28px; }
.btn { background:#2563eb; border:none; padding:13px 32px; border-radius:40px; font-weight:600; font-size:15px; color:#fff; text-decoration:none; display:inline-block; font-family:'Inter',sans-serif; box-shadow:0 4px 12px rgba(37,99,235,.25); }
.btn:hover { background:#1d4ed8; }
</style>
</head>
<body>
<div class="container">
  <nav><a href="/" class="logo">Data<span>Repli</span></a></nav>
</div>
<div class="container">
  <div class="wrap">
    {% if ok %}
      <div class="icon ok"><i class="fas fa-check"></i></div>
      <h1>Message received</h1>
      <p>Thanks for getting in touch — you'll get a reply within a day or so.</p>
    {% else %}
      <div class="icon err"><i class="fas fa-exclamation"></i></div>
      <h1>That didn't go through</h1>
      <p>Something went wrong saving your message. Please email hello@datarepli.com directly and it'll get picked up.</p>
    {% endif %}
    <a href="/" class="btn">Back to home</a>
  </div>
</div>
</body>
</html>
